
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bashar Snap</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101018;color:white;
 font-family:Arial,sans-serif;text-align:center
}
header{padding:16px;color:#ffe45e;font-size:25px;font-weight:bold}
.camera{
 position:relative;width:94%;max-width:500px;
 margin:auto;border-radius:22px;overflow:hidden;
 background:#222;aspect-ratio:3/4
}
video,canvas{
 position:absolute;width:100%;height:100%;
 top:0;left:0;object-fit:cover
}
#effects{pointer-events:none}
.controls{padding:15px}
button{
 border:0;border-radius:25px;padding:12px 17px;
 margin:5px;background:#29293b;color:white;
 font-size:15px
}
button.active{background:#ffca28;color:#111}
#capture{background:#ffca28;color:#111;font-weight:bold}
#status{color:#ffe45e;font-size:13px;margin:10px}
.lenses{display:flex;overflow-x:auto;gap:8px;padding:10px}
.lenses button{min-width:95px}
</style>
</head>
<body>

<header>✨ Bashar Snap ✨</header>

<div class="camera">
 <video id="video" autoplay playsinline muted></video>
 <canvas id="effects"></canvas>
</div>

<div id="status">جارٍ تجهيز الكاميرا...</div>

<div class="lenses" id="lenses">
 <button data-filter="none" class="active">بدون عدسة</button>
 <button data-filter="mustache">🥸 شارب</button>
 <button data-filter="eyes">👀 عيون كبيرة</button>
 <button data-filter="heart">❤️ قلوب</button>
 <button data-filter="dog">🐶 كلب</button>
 <button data-filter="crown">👑 تاج</button>
 <button data-filter="nose">👃 أنف صغير</button>
 <button data-filter="bighead">🤪 رأس مضحك</button>
 <button data-filter="beauty">✨ تجميل</button>
 <button data-filter="stars">🌟 نجوم</button>
</div>

<div class="controls">
 <button id="switch">🔄 تبديل الكاميرا</button>
 <button id="capture">📸 التقاط الصورة</button>
 <button id="save">💾 حفظ الصورة</button>
 <input type="file" id="gallery" accept="image/*" hidden>
 <button id="choose">🖼️ اختيار صورة</button>
</div>

<script type="module">
import {
 FaceLandmarker,
 FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.getElementById("video");
const canvas=document.getElementById("effects");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");

let cameraSide="user";
let stream=null;
let filter="none";
let landmarker=null;
let lastPhoto=null;

async function startCamera(){
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());

  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:cameraSide,width:720,height:960},
   audio:false
  });

  video.srcObject=stream;
  await video.play();
  status.textContent="الكاميرا تعمل بنجاح ❤️";
 }catch(e){
  status.textContent="تعذر تشغيل الكاميرا. تحقق من الإذن.";
 }
}

async function startFaceTracking(){
 try{
  const vision=await FilesetResolver.forVisionTasks(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  landmarker=await FaceLandmarker.createFromOptions(vision,{
   baseOptions:{
    modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
    delegate:"GPU"
   },
   runningMode:"VIDEO",
   numFaces:1
  });

  status.textContent="تتبع الوجه جاهز! 😍";
 }catch(e){
  status.textContent="الكاميرا تعمل، لكن تعذر تحميل تتبع الوجه.";
 }
}

function drawSticker(x,y,size,emoji){
 ctx.font=size+"px Arial";
 ctx.textAlign="center";
 ctx.fillText(emoji,x,y);
}

function drawEffects(){
 requestAnimationFrame(drawEffects);

 if(!video.videoWidth)return;

 const w=video.clientWidth;
 const h=video.clientHeight;

 if(canvas.width!==w*devicePixelRatio ||
    canvas.height!==h*devicePixelRatio){
  canvas.width=w*devicePixelRatio;
  canvas.height=h*devicePixelRatio;
 }

 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 ctx.clearRect(0,0,w,h);

 if(!landmarker || video.readyState<2)return;

 try{
  const result=landmarker.detectForVideo(video,performance.now());
  if(!result.faceLandmarks.length)return;

  const p=result.faceLandmarks[0];
  const X=i=>p[i].x*w;
  const Y=i=>p[i].y*h;

  const leftEye={x:X(468),y:Y(468)};
  const rightEye={x:X(473),y:Y(473)};
  const nose={x:X(1),y:Y(1)};
  const mouth={x:X(13),y:Y(13)};
  const width=Math.abs(X(234)-X(454));

  if(filter==="mustache"){
   ctx.font=(width*.24)+"px Arial";
   ctx.textAlign="center";
   ctx.fillText("🥸",nose.x,mouth.y+width*.12);
  }

  if(filter==="eyes"){
   [leftEye,rightEye].forEach(e=>{
    ctx.beginPath();
    ctx.fillStyle="white";
    ctx.arc(e.x,e.y,width*.085,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle="#222";
    ctx.arc(e.x,e.y,width*.035,0,Math.PI*2);
    ctx.fill();
   });
  }

  if(filter==="heart"){
   drawSticker(X(10)*1,Y(10),width*.3,"❤️");
   drawSticker(X(152),Y(152),width*.2,"💕");
  }

  if(filter==="dog"){
   drawSticker(X(234),Y(234),width*.35,"🐶");
   drawSticker(X(454),Y(454),width*.35,"🐶");
  }

  if(filter==="crown"){
   drawSticker(X(10),Y(10)-width*.2,width*.35,"👑");
  }

  if(filter==="nose"){
   drawSticker(nose.x,nose.y+width*.06,width*.13,"🐽");
  }

  if(filter==="bighead"){
   ctx.beginPath();
   ctx.ellipse(
    (X(234)+X(454))/2,
    (Y(10)+Y(152))/2,
    width*.62,width*.68,0,0,Math.PI*2
   );
   ctx.strokeStyle="#ffca28";
   ctx.lineWidth=5;
   ctx.stroke();
   drawSticker(nose.x,Y(10)-width*.3,width*.25,"🤪");
  }

  if(filter==="beauty"){
   ctx.beginPath();
   ctx.arc(nose.x,nose.y,width*.55,0,Math.PI*2);
   ctx.strokeStyle="rgba(255,180,220,.7)";
   ctx.lineWidth=3;
   ctx.stroke();
  }

  if(filter==="stars"){
   drawSticker(X(10),Y(10),width*.22,"✨");
   drawSticker(X(152),Y(152),width*.2,"🌟");
  }

 }catch(e){}
}

document.getElementById("lenses").onclick=e=>{
 const b=e.target.closest("button[data-filter]");
 if(!b)return;
 filter=b.dataset.filter;
 document.querySelectorAll(".lenses button")
 .forEach(x=>x.classList.toggle("active",x===b));
};

document.getElementById("switch").onclick=()=>{
 cameraSide=cameraSide==="user"?"environment":"user";
 startCamera();
};

function makePhoto(){
 const out=document.createElement("canvas");
 out.width=video.videoWidth;
 out.height=video.videoHeight;
 const c=out.getContext("2d");

 c.drawImage(video,0,0,out.width,out.height);
 c.drawImage(canvas,0,0,out.width,out.height);

 return out.toDataURL("image/jpeg",0.95);
}

document.getElementById("capture").onclick=()=>{
 if(!video.videoWidth){
  status.textContent="انتظر حتى تعمل الكاميرا";
  return;
 }
 lastPhoto=makePhoto();
 status.textContent="تم التقاط الصورة! ❤️";
};

document.getElementById("save").onclick=()=>{
 if(!lastPhoto){
  status.textContent="التقط صورة أولاً";
  return;
 }
 const a=document.createElement("a");
 a.href=lastPhoto;
 a.download="Bashar-Snap.jpg";
 a.click();
 status.textContent="تم طلب حفظ الصورة";
};

document.getElementById("choose").onclick=()=>{
 document.getElementById("gallery").click();
};

document.getElementById("gallery").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  URL.revokeObjectURL(url);
 };
 img.src=url;
 status.textContent="تم اختيار الصورة";
};

await startCamera();
await startFaceTracking();
drawEffects();
</script>
</body>
</html>
