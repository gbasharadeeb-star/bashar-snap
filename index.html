
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Bashar Snap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:white;font-family:Arial,sans-serif;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.logo{color:#ffeb00;font-size:22px;font-weight:bold}
button{cursor:pointer}
.topbtn{background:none;border:0;color:white;font-size:27px}
.camera{flex:1;position:relative;overflow:hidden;background:#181818}
video,#preview{width:100%;height:100%;object-fit:cover}
#preview{display:none;position:absolute;inset:0;background:#000}
#status{position:absolute;top:15px;left:0;right:0;text-align:center;text-shadow:0 2px 5px #000;z-index:2}
#permission{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#111;text-align:center;padding:20px;z-index:3}
#permission button{background:#ffeb00;color:#000;border:0;border-radius:25px;padding:13px 25px;font-weight:bold}
.hidden{display:none!important}
.controls{background:#080808;padding:12px 10px 18px}
.filters{display:flex;gap:13px;overflow-x:auto;padding:8px 0 18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 62px;text-align:center;font-size:11px;color:#aaa}
.circle{height:52px;width:52px;border-radius:50%;margin:0 auto 7px;border:2px solid #555;background:linear-gradient(135deg,#333,#999)}
.filter.active{color:#ffeb00}
.filter.active .circle{border:3px solid #ffeb00}
.actions{height:75px;display:flex;align-items:center;justify-content:space-around}
.side{background:none;border:0;color:white;font-size:28px;width:55px}
.capture{width:70px;height:70px;border-radius:50%;border:5px solid white;background:#ffeb00;box-shadow:0 0 0 4px #555}
.bottom{text-align:center;color:#777;font-size:11px;padding-top:5px}
</style>
</head>
<body>
<div class="app">
<header>
<button class="topbtn" id="gallery">▧</button>
<div class="logo">BASHAR SNAP</div>
<button class="topbtn" id="switch">↻</button>
</header>

<main class="camera">
<video id="video" autoplay playsinline muted></video>
<img id="preview" alt="الصورة">
<div id="status">BASHAR SNAP</div>
<div id="permission">
<div style="font-size:55px">📸</div>
<h2>مرحباً بك في Bashar Snap</h2>
<p>التقط أجمل صورك مع الفلاتر</p>
<button id="start">فتح الكاميرا</button>
</div>
</main>

<section class="controls">
<div class="filters">
<div class="filter active" data-filter="none"><div class="circle"></div>عادي</div>
<div class="filter" data-filter="grayscale(1)"><div class="circle" style="filter:grayscale(1)"></div>أبيض وأسود</div>
<div class="filter" data-filter="sepia(.8)"><div class="circle" style="filter:sepia(.8)"></div>كلاسيكي</div>
<div class="filter" data-filter="saturate(1.8)"><div class="circle" style="filter:saturate(1.8)"></div>ألوان</div>
<div class="filter" data-filter="contrast(1.5)"><div class="circle" style="filter:contrast(1.5)"></div>تباين</div>
<div class="filter" data-filter="brightness(1.3)"><div class="circle" style="filter:brightness(1.3)"></div>إضاءة</div>
<div class="filter" data-filter="hue-rotate(90deg)"><div class="circle" style="filter:hue-rotate(90deg)"></div>أخضر</div>
<div class="filter" data-filter="hue-rotate(180deg)"><div class="circle" style="filter:hue-rotate(180deg)"></div>بارد</div>
<div class="filter" data-filter="saturate(1.5) sepia(.2)"><div class="circle" style="filter:saturate(1.5) sepia(.2)"></div>دافئ</div>
<div class="filter" data-filter="brightness(1.1) contrast(1.1)"><div class="circle" style="filter:brightness(1.1) contrast(1.1)"></div>ناعم</div>
</div>

<div class="actions">
<button class="side" id="save">↓</button>
<button class="capture" id="capture"></button>
<button class="side" id="retake">⟳</button>
</div>
<div class="bottom">Bashar Snap © 2026</div>
</section>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
const video=document.getElementById("video");
const preview=document.getElementById("preview");
const canvas=document.getElementById("canvas");
const statusText=document.getElementById("status");
const permission=document.getElementById("permission");

let stream=null;
let facing="user";
let currentFilter="none";
let photo=null;

async function startCamera(){
try{
statusText.textContent="جار طلب إذن الكاميرا...";

const nativePlugin=window.Capacitor?.Plugins?.CameraPermission;

if(nativePlugin){
const permissionResult=await nativePlugin.request();

if(permissionResult && permissionResult.granted===false){
throw new Error("CAMERA_PERMISSION_DENIED");
}
}

if(!navigator.mediaDevices?.getUserMedia){
throw new Error("GET_USER_MEDIA_NOT_AVAILABLE");
}

if(stream){
stream.getTracks().forEach(t=>t.stop());
}

statusText.textContent="جار تشغيل الكاميرا...";

stream=await navigator.mediaDevices.getUserMedia({
audio:false,
video:{
facingMode:facing,
width:{ideal:1280},
height:{ideal:1920}
}
});

video.srcObject=stream;
await video.play();

video.style.display="block";
preview.style.display="none";
video.style.filter=currentFilter;

permission.classList.add("hidden");
statusText.textContent="BASHAR SNAP";

}catch(e){
console.error("Bashar Snap camera error:",e);

permission.classList.remove("hidden");
statusText.textContent="تعذر تشغيل الكاميرا";

const messages={
CAMERA_PERMISSION_DENIED:"لم تسمح باستخدام الكاميرا. تحقق من إذن الكاميرا في إعدادات الهاتف.",
GET_USER_MEDIA_NOT_AVAILABLE:"خدمة الكاميرا غير متاحة في هذه النسخة."
};

permission.querySelector("p").textContent=
messages[e.message] || "حدث خطأ أثناء تشغيل الكاميرا: "+e.message;
}
}

document.getElementById("start").onclick=startCamera;

document.getElementById("switch").onclick=()=>{
facing=facing==="user"?"environment":"user";
startCamera();
};

document.querySelectorAll(".filter").forEach(item=>{
item.onclick=()=>{
document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
item.classList.add("active");
currentFilter=item.dataset.filter;
video.style.filter=currentFilter;
};
});

document.getElementById("capture").onclick=()=>{
if(!stream||!video.videoWidth){
statusText.textContent="افتح الكاميرا أولاً";
return;
}

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");
ctx.save();

if(facing==="user"){
ctx.translate(canvas.width,0);
ctx.scale(-1,1);
}

ctx.filter=currentFilter;
ctx.drawImage(video,0,0,canvas.width,canvas.height);
ctx.restore();

photo=canvas.toDataURL("image/jpeg",0.95);
preview.src=photo;
preview.style.display="block";
video.style.display="none";
statusText.textContent="تم التقاط الصورة ❤️";
};

document.getElementById("save").onclick=()=>{
if(!photo){
statusText.textContent="التقط صورة أولاً";
return;
}

const a=document.createElement("a");
a.href=photo;
a.download="Bashar-Snap.jpg";
a.click();
};

document.getElementById("retake").onclick=()=>{
if(stream){
preview.style.display="none";
video.style.display="block";
statusText.textContent="BASHAR SNAP";
}else{
startCamera();
}
};

document.getElementById("gallery").onclick=()=>{
const picker=document.createElement("input");
picker.type="file";
picker.accept="image/*";

picker.onchange=()=>{
const file=picker.files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=()=>{
photo=reader.result;
preview.src=photo;
preview.style.display="block";
video.style.display="none";
statusText.textContent="الصورة من المعرض";
};

reader.readAsDataURL(file);
};

picker.click();
};
</script>
</body>
</html>
