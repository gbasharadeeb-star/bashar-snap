
name: Build Bashar Snap Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install Android package
        run: npm install @capacitor/android@^7

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Add native camera and gallery plugins
        run: |
          mkdir -p android/app/src/main/java/com/bashar/snap

          cat > android/app/src/main/java/com/bashar/snap/CameraPermissionPlugin.java <<'EOF'
          package com.bashar.snap;

          import android.Manifest;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "CameraPermission",
              permissions = {
                  @Permission(alias = "camera", strings = { Manifest.permission.CAMERA })
              }
          )
          public class CameraPermissionPlugin extends Plugin {
              @PluginMethod
              public void request(PluginCall call) {
                  if (getPermissionState("camera") == PermissionState.GRANTED) {
                      JSObject result = new JSObject();
                      result.put("granted", true);
                      call.resolve(result);
                  } else {
                      requestPermissionForAlias("camera", call, "cameraPermsCallback");
                  }
              }

              @PermissionCallback
              private void cameraPermsCallback(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("granted", getPermissionState("camera") == PermissionState.GRANTED);
                  call.resolve(result);
              }
          }
          EOF

          cat > android/app/src/main/java/com/bashar/snap/GallerySavePlugin.java <<'EOF'
          package com.bashar.snap;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import java.io.OutputStream;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "GallerySave")
          public class GallerySavePlugin extends Plugin {

              @PluginMethod
              public void save(PluginCall call) {
                  String dataUrl = call.getString("dataUrl");

                  if (dataUrl == null || !dataUrl.contains(",")) {
                      call.reject("الصورة غير صالحة");
                      return;
                  }

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      call.reject("حفظ الصور بهذه الطريقة يحتاج Android 10 أو أحدث");
                      return;
                  }

                  Uri imageUri = null;

                  try {
                      String base64 = dataUrl.substring(dataUrl.indexOf(",") + 1);
                      byte[] imageBytes = Base64.decode(base64, Base64.DEFAULT);

                      ContentValues values = new ContentValues();
                      values.put(
                          MediaStore.Images.Media.DISPLAY_NAME,
                          "Bashar-Snap-" + System.currentTimeMillis() + ".jpg"
                      );
                      values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                      values.put(
                          MediaStore.Images.Media.RELATIVE_PATH,
                          Environment.DIRECTORY_PICTURES + "/Bashar Snap"
                      );
                      values.put(MediaStore.Images.Media.IS_PENDING, 1);

                      imageUri = getContext().getContentResolver().insert(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          values
                      );

                      if (imageUri == null) {
                          throw new Exception("تعذر إنشاء ملف الصورة");
                      }

                      try (OutputStream output = getContext()
                              .getContentResolver()
                              .openOutputStream(imageUri)) {

                          if (output == null) {
                              throw new Exception("تعذر فتح ملف الصورة");
                          }

                          output.write(imageBytes);
                          output.flush();
                      }

                      ContentValues completed = new ContentValues();
                      completed.put(MediaStore.Images.Media.IS_PENDING, 0);

                      getContext().getContentResolver().update(
                          imageUri,
                          completed,
                          null,
                          null
                      );

                      JSObject result = new JSObject();
                      result.put("saved", true);
                      result.put("uri", imageUri.toString());
                      call.resolve(result);

                  } catch (Exception error) {
                      if (imageUri != null) {
                          getContext().getContentResolver().delete(
                              imageUri,
                              null,
                              null
                          );
                      }
                      call.reject("فشل حفظ الصورة في المعرض", error);
                  }
              }
          }
          EOF

          cat > android/app/src/main/java/com/bashar/snap/MainActivity.java <<'EOF'
          package com.bashar.snap;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(CameraPermissionPlugin.class);
                  registerPlugin(GallerySavePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bashar-Snap-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
